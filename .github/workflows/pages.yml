name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test runner
        run: npm install --no-save playwright-core
      - name: Run rule, interface and app tests in headless Chrome
        run: node tests/run-tests.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome

  deploy:
    # Publish only from main, and only after the tests pass.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir site
          cp -r index.html manifest.webmanifest sw.js icons site/
          # Running copies compare this number with their own to know when to update.
          node -e "const fs=require('fs');const v=fs.readFileSync('index.html','utf8').match(/APP_VERSION = '([^']+)'/)[1];fs.writeFileSync('site/version.json',JSON.stringify({version:v}));console.log('Publishing version',v)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
